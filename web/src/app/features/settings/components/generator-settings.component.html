<form class="grid gap-6 md:grid-cols-2" [formGroup]="settingsForm" (ngSubmit)="applySettings()">
  <app-number-field
    inputId="instrument-count"
    inputName="instrumentCount"
    label="Instrument count"
    [control]="controls.instrumentCount"
    [min]="limits.instrumentCount.min"
    [max]="limits.instrumentCount.max"
    rangeUnit="instruments"
  />

  <app-number-field
    inputId="updates-per-batch"
    inputName="updatesPerBatch"
    label="Updates per batch"
    [control]="controls.updatesPerBatch"
    [min]="limits.updatesPerBatch.min"
    [max]="limits.updatesPerBatch.max"
    rangeUnit="updates"
  />

  <app-number-field
    inputId="update-interval"
    inputName="updateIntervalMs"
    label="Batch interval"
    [control]="controls.updateIntervalMs"
    [min]="limits.updateIntervalMs.min"
    [max]="limits.updateIntervalMs.max"
    rangeUnit="ms"
    errorUnit="ms"
    suffix="ms"
  />

  <div class="flex justify-end md:col-span-2">
    <button class="btn btn-primary" type="submit" [disabled]="settingsForm.invalid">Apply</button>
  </div>
</form>
